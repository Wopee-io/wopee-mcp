name: Dependency Updates

on:
  schedule:
    # Run dependency updates weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Update type'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major
      create_pr:
        description: 'Create pull request'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '18'

jobs:
  # Check for outdated dependencies
  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      outdated_count: ${{ steps.check.outputs.outdated_count }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check for outdated dependencies
        id: check
        run: |
          echo "Checking for outdated dependencies..."
          
          # Get outdated packages
          npm outdated --json > outdated.json || true
          
          if [ -s outdated.json ]; then
            OUTDATED_COUNT=$(jq 'length' outdated.json)
            echo "Found $OUTDATED_COUNT outdated dependencies"
            
            echo "Outdated dependencies:"
            jq -r 'to_entries[] | "\(.key): \(.value.current) -> \(.value.latest)"' outdated.json
            
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "outdated_count=$OUTDATED_COUNT" >> $GITHUB_OUTPUT
          else
            echo "No outdated dependencies found"
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "outdated_count=0" >> $GITHUB_OUTPUT
          fi
          
      - name: Upload outdated dependencies
        uses: actions/upload-artifact@v4
        with:
          name: outdated-dependencies
          path: outdated.json
          retention-days: 7

  # Update dependencies
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    needs: check-dependencies
    if: needs.check-dependencies.outputs.has_updates == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Update dependencies
        run: |
          UPDATE_TYPE="${{ github.event.inputs.update_type || 'minor' }}"
          
          echo "Updating dependencies (type: $UPDATE_TYPE)..."
          
          if [ "$UPDATE_TYPE" = "patch" ]; then
            npx npm-check-updates -u --target patch
          elif [ "$UPDATE_TYPE" = "minor" ]; then
            npx npm-check-updates -u --target minor
          else
            npx npm-check-updates -u --target major
          fi
          
          # Install updated dependencies
          npm install
          
      - name: Run tests
        run: |
          npm run lint
          npm test
          
      - name: Build project
        run: npm run build
        
      - name: Check for breaking changes
        run: |
          echo "Checking for potential breaking changes..."
          
          # Compare package-lock.json for major version changes
          if [ -f package-lock.json ]; then
            echo "Package lock updated successfully"
          fi
          
      - name: Create pull request
        if: github.event.inputs.create_pr != 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies (${{ github.event.inputs.update_type || 'minor' }})"
          title: "chore: update dependencies (${{ github.event.inputs.update_type || 'minor' }})"
          body: |
            ## Dependency Updates
            
            This PR updates dependencies to their latest ${{ github.event.inputs.update_type || 'minor' }} versions.
            
            ### Changes
            - Updated ${{ needs.check-dependencies.outputs.outdated_count }} dependencies
            - All tests passing
            - Build successful
            
            ### Testing
            - [x] Linting passed
            - [x] Tests passed
            - [x] Build successful
            
            ### Review Checklist
            - [ ] Review dependency changes
            - [ ] Test functionality
            - [ ] Check for breaking changes
            - [ ] Update documentation if needed
            
            ---
            
            *This PR was created automatically by the dependency update workflow.*
          branch: dependency-updates-${{ github.run_number }}
          delete-branch: true

  # Notify about updates
  notify:
    name: Notify Updates
    runs-on: ubuntu-latest
    needs: [check-dependencies, update-dependencies]
    if: always()
    
    steps:
      - name: Notify about dependency updates
        run: |
          if [ "${{ needs.check-dependencies.outputs.has_updates }}" = "true" ]; then
            if [ "${{ needs.update-dependencies.result }}" = "success" ]; then
              echo "✅ Successfully updated ${{ needs.check-dependencies.outputs.outdated_count }} dependencies"
            else
              echo "❌ Failed to update dependencies"
            fi
          else
            echo "ℹ️ No dependency updates available"
          fi
