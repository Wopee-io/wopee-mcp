name: Release Management

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Create as prerelease'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'

jobs:
  # Validate release
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
          
      - name: Calculate new version
        id: version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          
          # Calculate new version
          if [ "$IS_PRERELEASE" = "true" ]; then
            # For prerelease, add prerelease identifier
            NEW_VERSION=$(npm version $RELEASE_TYPE --preid=beta --no-git-tag-version --json | jq -r '.')
          else
            # For regular release
            NEW_VERSION=$(npm version $RELEASE_TYPE --no-git-tag-version --json | jq -r '.')
          fi
          
          TAG="v$NEW_VERSION"
          
          echo "New version: $NEW_VERSION"
          echo "Tag: $TAG"
          echo "Is prerelease: $IS_PRERELEASE"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          
      - name: Check if version already exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          
          echo "Checking if version $VERSION of $PACKAGE_NAME already exists..."
          
          if npm view "$PACKAGE_NAME@$VERSION" version > /dev/null 2>&1; then
            echo "❌ Version $VERSION already exists on npm"
            exit 1
          else
            echo "✅ Version $VERSION is available for publishing"
          fi
          
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ There are uncommitted changes. Please commit or stash them first."
            git status --porcelain
            exit 1
          else
            echo "✅ Working directory is clean"
          fi

  # Run tests (optional)
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linting
        run: npm run lint
        
      - name: Run tests
        run: npm test
        
      - name: Run tests with coverage
        run: npm run test:coverage
        
      - name: Security audit
        run: npm audit --audit-level=moderate

  # Update version and create release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: Update version in package.json
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IS_PRERELEASE="${{ needs.validate.outputs.is_prerelease }}"
          
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm version $VERSION --no-git-tag-version
          else
            npm version $VERSION --no-git-tag-version
          fi
          
      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "Current tag: $TAG"
          echo "Previous tag: $PREVIOUS_TAG"
          
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=20)
          fi
          
          # Create a more detailed changelog
          DETAILED_CHANGELOG="## What's Changed
          
          $CHANGELOG
          
          ## Installation
          
          \`\`\`bash
          npm install -g wopee-mcp@${{ needs.validate.outputs.version }}
          \`\`\`
          
          ## Documentation
          
          - [Quick Start Guide](QUICK_START.md)
          - [Integration Guide](INTEGRATION.md)
          - [Examples](EXAMPLES.md)
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$TAG"
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$DETAILED_CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Commit version update
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ needs.validate.outputs.version }}"
          
      - name: Create and push tag
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          
      - name: Push changes
        run: |
          git push origin main
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          release_name: Release ${{ needs.validate.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ needs.validate.outputs.is_prerelease }}

  # Notify completion
  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [validate, release]
    if: always()
    
    steps:
      - name: Notify success
        if: needs.release.result == 'success'
        run: |
          echo "🎉 Successfully created release ${{ needs.validate.outputs.tag }}"
          echo "📦 Version: ${{ needs.validate.outputs.version }}"
          echo "🏷️  Tag: ${{ needs.validate.outputs.tag }}"
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}"
          
      - name: Notify failure
        if: needs.release.result == 'failure'
        run: |
          echo "❌ Failed to create release ${{ needs.validate.outputs.tag }}"
          exit 1
