name: Publish to MCP Registry

on:
  workflow_run:
    workflows: ["Publish to NPM"]
    types: [completed]

jobs:
  publish-mcp-registry:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Sync server.json version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('server.json'));
            d.version = '$VERSION';
            d.packages[0].version = '$VERSION';
            fs.writeFileSync('server.json', JSON.stringify(d, null, 2) + '\n');
          "

      - name: Wait for the npm version to be visible
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if npm view "wopee-mcp@$VERSION" version >/dev/null 2>&1; then echo "wopee-mcp@$VERSION is on npm"; exit 0; fi
            echo "wopee-mcp@$VERSION not on npm yet ($i/30)"; sleep 20
          done
          echo "wopee-mcp@$VERSION still not visible on npm after 10 minutes" >&2; exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
