name: CI/CD
on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  setup-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

  test-build:
    needs: [setup-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:clean

      - name: Test
        run: npm test

      - name: Check skills/wopee/SKILL.md lists the current tools
        run: npm run check:skill

  release:
    needs: [test-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # npm 11.19.1, not the npm 10 that Node 22 bundles: npm 10 (its pacote) demands a registry key
      # for every attestation bundle, so a package whose answer carries only keyless SLSA
      # provenance fails with EMISSINGSIGNATUREKEY although nothing is wrong with it. npm 11.19.1
      # checks keys for keyed (publish) attestations only, and still verifies everything else.
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npx --yes npm@11.19.1 audit signatures

      - name: Release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
