name: CI/CD
on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  setup-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

  test-build:
    needs: [setup-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:clean

      - name: Test
        run: npm test

      - name: Check skills/wopee/SKILL.md lists the current tools
        run: npm run check:skill

  # Pull requests build the container image from the branch's own `npm pack` and smoke
  # test it under the production limits, without pushing. The release image is built and
  # pushed by publish.yml from the package on npm.
  image:
    needs: [setup-npm]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination container

      - name: Build the image
        run: |
          set -euo pipefail
          tgz="$(cd container && ls wopee-mcp-*.tgz)"
          docker buildx build --load --pull --platform linux/amd64 \
            --build-arg "MCP_PACKAGE=/ctx/$tgz" \
            --tag wopee-mcp:pr container

      - name: Smoke test
        run: bash scripts/smoke-image.sh wopee-mcp:pr

  release:
    needs: [test-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # npm 11.19.1, not the npm 10 that Node 22 bundles: npm 10 (its pacote) demands a registry key
      # for every attestation bundle, so a package whose answer carries only keyless SLSA
      # provenance fails with EMISSINGSIGNATUREKEY although nothing is wrong with it. npm 11.19.1
      # checks keys for keyed (publish) attestations only, and still verifies everything else.
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npx --yes npm@11.19.1 audit signatures

      - name: Release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
